[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "multi-agent-financial-research"
version = "1.0.0"
description = "Multi-agent crypto trading system with consensus debate"
requires-python = ">=3.10"
dependencies = [
    "pandas_ta",
    "requests",
    "pandas",
    "chromadb",
    "numpy",
    "yfinance",
    "fredapi",
    "feedparser",
    "trafilatura",
    "ccxt",
    "matplotlib",
    "aiogram",
    "apscheduler",
    "aiosqlite",
    "googletrans==4.0.0rc1",
]

[tool.setuptools.packages.find]
include = ["agents*", "utils*", "scripts*", "memory_store*"]
